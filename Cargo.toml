[workspace]
members = [
    "catalogs/iceberg-file-catalog",
    "catalogs/iceberg-glue-catalog",
    "catalogs/iceberg-rest-catalog",
    "catalogs/iceberg-s3tables-catalog",
    "catalogs/iceberg-sql-catalog",
    "datafusion-iceberg-sql",
    "datafusion_iceberg",
    "iceberg-rust",
    "iceberg-rust-spec",
]

resolver = "2"

[workspace.dependencies]
apache-avro = "0.21"
arrow = "59"
arrow-schema = "59"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
    "serde",
    "clock",
] }
crc32fast = "1.4"
#Official Releases
#datafusion = "55"
#datafusion-common = "55"
#datafusion-execution = "55"
#datafusion-expr = "55"
#datafusion-functions = { version = "55", features = ["crypto_expressions"] }
#datafusion-functions-aggregate = "55"
#datafusion-sql = "55"

#Fork (icebreaker-data/datafusion main, rebased onto 55.1.0)
datafusion = { version = "55", features = ["backtrace", ], git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }
datafusion-common = { version = "55", git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }
datafusion-execution = { version = "55", git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }
datafusion-expr = { version = "55", git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }
datafusion-functions = { version = "55", features = ["crypto_expressions"], git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }
datafusion-functions-aggregate = { version = "55", git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }
datafusion-proto = { version = "55", git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }
datafusion-sql = { version = "55", git = "https://github.com/icebreaker-data/datafusion.git", rev = "0b5a678b86e915d6d977a89110a7ce2e0205e18c" }

#Local Changes (for local development against the datafusion-andts checkout)
#datafusion = { version = "55", features = ["backtrace", ], path = "../../datafusion-andts/datafusion/core" }
#datafusion-common = { version = "55", path = "../../datafusion-andts/datafusion/common"  }
#datafusion-execution = { version = "55", path = "../../datafusion-andts/datafusion/execution" }
#datafusion-expr = { version = "55", path = "../../datafusion-andts/datafusion/expr" }
#datafusion-functions = { version = "55", features = ["crypto_expressions"], path = "../../datafusion-andts/datafusion/functions" }
#datafusion-functions-aggregate = { version = "55", path = "../../datafusion-andts/datafusion/functions-aggregate" }
#datafusion-proto = { version = "55", path = "../../datafusion-andts/datafusion/proto" }
#datafusion-sql = { version = "55", path = "../../datafusion-andts/datafusion/sql" }
derive-getters = "0.5.0"
derive_builder = "0.20"
futures = "0.3.31"
fastnum = { version = "0.7", default-features = false, features = ["std", "serde"] }
getrandom = { version = "0.4.2", features = ["std"] }
itertools = "0.14.0"
lazy_static = "1.5.0"
lru = "0.18.0"
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
murmur3 = { version = "0.5.2" }
parquet = { version = "59", features = ["async", "object_store"] }
pin-project-lite = "0.2"
regex = "1.11.1"
roaring = "0.10"
serde = "^1.0"
serde_derive = "^1.0"
serde_json = "^1.0"
sqlparser = { version = "0.62", features = ["visitor"] }
thiserror = "2"
tracing = "0.1"
tracing-futures = "0.2"
url = "^2.5"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
